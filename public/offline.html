<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Fuhrpark-Manager</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f5f5f4;
        color: #1c1c1a;
        font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      .box {
        max-width: 22rem;
        text-align: center;
        border: 1px solid #dcdcd7;
        border-radius: 6px;
        background: #fff;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1rem;
        font-size: 0.9375rem;
        color: #6b6b66;
      }
      button {
        border: 1px solid #2b2b28;
        background: #2b2b28;
        color: #fff;
        border-radius: 4px;
        padding: 0.5rem 1rem;
        font: inherit;
        font-size: 0.9375rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Keine Verbindung</h1>
      <p>
        Der Fuhrpark-Manager braucht eine Internetverbindung, um deine Fahrzeugdaten
        zu laden. Sobald du wieder online bist, geht es weiter.
      </p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
